name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf automake libtool pkg-config \
          libncurses5-dev libncursesw5-dev \
          zlib1g-dev liblzma-dev libbz2-dev \
          libffi-dev libssl-dev \
          openjdk-17-jdk-headless \
          git unzip wget
        
        # 安装特定版本的autoconf相关工具
        sudo apt-get install -y autoconf2.69 automake1.11
    
    - name: Install buildozer
      run: |
        pip install buildozer==1.5.0 cython
        pip install kivy
    
    - name: Configure buildozer
      run: |
        cat > buildozer.spec << 'EOF'
[app]

title = MusicDL
package.name = musicdl
package.domain = org.test
source.dir = .
source.include_exts = py,png,jpg,kv,atlas
version = 1.0.0
requirements = python3,kivy
orientation = portrait
fullscreen = 0

android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE
android.api = 31
android.minapi = 21
android.ndk = 25b
android.sdk_path = /opt/android-sdk
android.ndk_path = /opt/android-ndk-r25b
android.archs = arm64-v8a
android.accept_sdk_license = True
android.skip_update = False

[buildozer]
log_level = 2
warn_on_root = 1
EOF
    
    - name: Build APK with buildozer
      run: |
        export JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.18-8/x64
        buildozer android debug 2>&1 | tee build.log || true
        
        # 查找生成的APK
        find . -name "*.apk" -type f 2>/dev/null
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: musicdl-apk
        path: |
          bin/*.apk
          ./.buildozer/android/platform/build*/build/*.apk
          build.log
        retention-days: 7
        if-no-files-found: warn
    
    - name: Send email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL APK编译 - 尝试1
        body: |
          编译结果：请查看 https://github.com/chenqf-ubuntu/musicdl-android/actions
        to: 13383817575@163.com
        from: MusicDL Builder