name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        df -h
    
    - name: Setup Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y --no-install-recommends \
          build-essential git zip unzip \
          autoconf automake cmake libtool pkg-config \
          libncurses5-dev libncursesw5-dev \
          libc6-dev libstdc++6 libffi-dev libssl-dev zlib1g-dev
        sudo apt-get clean
    
    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython
        pip install kivy
    
    - name: Configure buildozer.spec
      run: |
        rm -f buildozer.spec
        buildozer init
        sed -i 's/^title.*=.*/title = MusicDL/' buildozer.spec
        sed -i 's/^package.name.*=.*/package.name = musicdl/' buildozer.spec
        sed -i 's/^package.domain.*=.*/package.domain = org.musicdl/' buildozer.spec
        sed -i 's/^source.dir.*=.*/source.dir = ./' buildozer.spec
        sed -i 's/^version.*=.*/version = 1.0/' buildozer.spec
        sed -i 's/^requirements.*=.*/requirements = python3,kivy/' buildozer.spec
        sed -i 's/^fullscreen.*=.*/fullscreen = 0/' buildozer.spec
        sed -i 's/^orientation.*=.*/orientation = portrait/' buildozer.spec
        sed -i 's/^android.permissions.*=.*/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/^android.api.*=.*/android.api = 31/' buildozer.spec
        sed -i 's/^android.minapi.*=.*/android.minapi = 21/' buildozer.spec
        sed -i 's/^android.ndk.*=.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/^android.archs.*=.*/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/^android.accept_sdk_license.*=.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^log_level.*=.*/log_level = 2/' buildozer.spec
    
    - name: Pre-setup Android SDK for buildozer
      run: |
        # 设置环境变量
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        
        # 创建buildozer将使用的SDK目录
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/platforms
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # 复制预装的build-tools到buildozer目录
        # 先检查预装的build-tools版本
        ls -la $ANDROID_SDK_ROOT/build-tools/ || echo "No build-tools in pre-installed SDK"
        
        # 从预装SDK复制或下载build-tools
        if [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
          # 复制最新的build-tools版本
          LATEST_BT=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          echo "Copying build-tools $LATEST_BT"
          cp -r $ANDROID_SDK_ROOT/build-tools/$LATEST_BT /home/runner/.buildozer/android/platform/android-sdk/build-tools/
        else
          # 手动下载build-tools
          echo "Downloading build-tools 31.0.0"
          cd /tmp
          wget -q https://dl.google.com/android/repository/build-tools_r31-linux.zip
          unzip -q build-tools_r31-linux.zip
          mv android-11 /home/runner/.buildozer/android/platform/android-sdk/build-tools/31.0.0
        fi
        
        # 复制platforms
        if [ -d "$ANDROID_SDK_ROOT/platforms" ]; then
          cp -r $ANDROID_SDK_ROOT/platforms /home/runner/.buildozer/android/platform/android-sdk/ || true
        fi
        
        # 验证aidl存在
        ls -la /home/runner/.buildozer/android/platform/android-sdk/build-tools/*/aidl || echo "aidl check failed"
        
        # 接受许可证
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license
        echo -e "\n84831b9409646a90881d7ab4c3d0ff0e1c1a9b56" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\nd975f751698a77b662f125460be17e5b7d9d8e75" > /home/runner/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license-2
    
    - name: Build Android APK
      id: build_apk
      run: |
        echo "Starting buildozer build..."
        buildozer android debug 2>&1 | tee build_output.log || true
        
        echo "Build completed. Checking for APK..."
        if find bin -name "*.apk" -type f 2>/dev/null | head -1; then
          echo "apk_found=true" >> $GITHUB_OUTPUT
          ls -la bin/*.apk
        else
          echo "apk_found=false" >> $GITHUB_OUTPUT
          find .buildozer -name "*.apk" -type f 2>/dev/null || true
        fi
    
    - name: Upload APK
      if: steps.build_apk.outputs.apk_found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: musicdl-apk-arm64
        path: bin/*.apk
        retention-days: 30
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.log
        retention-days: 7
    
    - name: Send success email
      if: steps.build_apk.outputs.apk_found == 'true'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL APK编译成功！
        body: |
          MusicDL APK已成功编译！
          下载：https://github.com/chenqf-ubuntu/musicdl-android/actions
          适用于ARM64架构（华为Mate X5）。
        to: 13383817575@163.com
        from: MusicDL Builder
    
    - name: Send failure email
      if: failure() || steps.build_apk.outputs.apk_found != 'true'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL编译失败-尝试18
        body: 查看日志：https://github.com/chenqf-ubuntu/musicdl-android/actions
        to: 13383817575@163.com
        from: MusicDL Builder