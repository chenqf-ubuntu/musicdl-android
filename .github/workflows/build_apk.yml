name: Build Android APK with Briefcase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Install Briefcase
      run: |
        pip install briefcase
        pip install kivy
    
    - name: Create minimal app
      run: |
        mkdir -p src/musicdl
        cat > src/musicdl/__main__.py << 'ENDPY'
print("MusicDL - Music Downloader")
print("正在初始化...")
ENDPY
    
    - name: Initialize Briefcase
      run: |
        briefcase new --no-input -a "MusicDL" -d "org.test" -p "musicdl" || true
    
    - name: Create Android project
      run: |
        cd MusicDL
        briefcase create android || true
    
    - name: Build APK
      run: |
        cd MusicDL
        briefcase build android || true
        briefcase package android || true
        find . -name "*.apk" -type f
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: musicdl-apk
        path: |
          MusicDL/android/*.apk
          MusicDL/dist/*.apk
        retention-days: 7
    
    - name: Send email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL编译尝试7-Briefcase
        body: 编译结果请查看 https://github.com/chenqf-ubuntu/musicdl-android/actions
        to: 13383817575@163.com
        from: MusicDL Builder