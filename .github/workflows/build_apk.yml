name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Install Briefcase
      run: pip install briefcase kivy
    
    - name: Create app
      run: |
        mkdir -p src/musicdl
        echo 'print("MusicDL")' > src/musicdl/__main__.py
    
    - name: Build
      run: |
        briefcase new --no-input -a MusicDL -d org.test -p musicdl || true
        cd MusicDL || true
        briefcase create android || true
        briefcase build android || true
        briefcase package android || true
        find . -name "*.apk" || true
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: musicdl-apk
        path: MusicDL/android/*.apk
        retention-days: 7
    
    - name: Send email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL编译尝试8
        body: 编译结果请查看 https://github.com/chenqf-ubuntu/musicdl-android/actions
        to: 13383817575@163.com
        from: MusicDL Builder