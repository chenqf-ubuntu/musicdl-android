name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 增加超时时间
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython
        pip install kivy[base]
    
    - name: Build APK
      run: |
        # 简化requirements，只保留核心依赖
        sed -i 's/^requirements =.*/requirements = python3,kivy,requests/' buildozer.spec
        buildozer android debug 2>&1 | tee build.log
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: musicdl-apk
        path: |
          bin/*.apk
          build.log
        retention-days: 7
    
    - name: Send success email
      if: success()
      run: |
        APK_FILE=$(find bin -name "*.apk" -type f | head -1)
        if [ -n "$APK_FILE" ]; then
          python3 -c "
import smtplib
from email.mime.multipart import MIMEMultipart
from email.mime.text import MIMEText
from email.mime.base import MIMEBase
from email import encoders
import os

msg = MIMEMultipart()
msg['From'] = '13383817575@163.com'
msg['To'] = '13383817575@163.com'
msg['Subject'] = 'MusicDL APK 编译成功'

body = '''您好！

MusicDL Android APK 已编译成功！

下载方式：
1. GitHub Actions Artifacts页面下载
2. 或直接从邮件附件下载

仓库地址: https://github.com/chenqf-ubuntu/musicdl-android

祝您使用愉快！'''
msg.attach(MIMEText(body, 'plain', 'utf-8'))

with open('$APK_FILE', 'rb') as f:
    part = MIMEBase('application', 'octet-stream')
    part.set_payload(f.read())
    encoders.encode_base64(part)
    part.add_header('Content-Disposition', 'attachment')
    msg.attach(part)

server = smtplib.SMTP_SSL('smtp.163.com', 465)
server.login('13383817575@163.com', os.environ['EMAIL_PASSWORD'])
server.send_message(msg)
server.quit()
print('邮件发送成功')
          "
        fi
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
    
    - name: Send failure email
      if: failure()
      run: |
        python3 -c "
import smtplib
from email.mime.text import MIMEText
import os

msg = MIMEText('MusicDL APK编译失败，请查看日志:\nhttps://github.com/chenqf-ubuntu/musicdl-android/actions', 'plain', 'utf-8')
msg['Subject'] = 'MusicDL APK 编译失败'
msg['From'] = '13383817575@163.com'
msg['To'] = '13383817575@163.com'

server = smtplib.SMTP_SSL('smtp.163.com', 465)
server.login('13383817575@163.com', os.environ['EMAIL_PASSWORD'])
server.send_message(msg)
server.quit()
print('邮件发送成功')
        "
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}