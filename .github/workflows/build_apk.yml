name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config libncurses5-dev libncursesw5-dev zlib1g-dev libffi-dev libssl-dev git unzip wget cmake
        pip install buildozer==1.5.1 cython
        pip install kivy
    
    - name: Create buildozer spec for Python 3.8
      run: |
        cat > buildozer.spec << 'EOF'
[app]
title = MusicDL
package.name = musicdl
package.domain = org.test
source.dir = .
source.include_exts = py
version = 1.0
requirements = python3==3.8,kivy
orientation = portrait
fullscreen = 0
android.permissions = INTERNET
android.api = 31
android.minapi = 21
android.ndk = 25b
android.archs = arm64-v8a
android.accept_sdk_license = True

[buildozer]
log_level = 2
EOF
    
    - name: Build APK
      run: |
        export JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.18-8/x64
        buildozer android debug || true
        find . -name "*.apk" -type f
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: musicdl-apk
        path: |
          bin/*.apk
          .buildozer/android/platform/build*/build/*.apk
        retention-days: 7
    
    - name: Send email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL编译尝试5-Python3.8
        body: 编译结果请查看 https://github.com/chenqf-ubuntu/musicdl-android/actions
        to: 13383817575@163.com
        from: MusicDL Builder