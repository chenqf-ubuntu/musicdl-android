name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config libncurses5-dev libncursesw5-dev zlib1g-dev liblzma-dev libbz2-dev libffi-dev libssl-dev openjdk-17-jdk-headless git unzip wget
    
    - name: Install buildozer
      run: |
        pip install buildozer==1.5.0 cython
        pip install kivy
    
    - name: Create buildozer spec
      run: |
        echo '[app]' > buildozer.spec
        echo 'title = MusicDL' >> buildozer.spec
        echo 'package.name = musicdl' >> buildozer.spec
        echo 'package.domain = org.test' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'requirements = python3,kivy' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo 'fullscreen = 0' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec
    
    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log || true
        find . -name "*.apk" -type f 2>/dev/null
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: musicdl-apk
        path: bin/*.apk
        retention-days: 7
    
    - name: Send email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL APK编译尝试2
        body: 编译结果请查看 https://github.com/chenqf-ubuntu/musicdl-android/actions
        to: 13383817575@163.com
        from: MusicDL Builder