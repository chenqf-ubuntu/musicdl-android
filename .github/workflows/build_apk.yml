name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install buildozer
      run: |
        pip install buildozer cython
        pip install kivy[base]
    
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ~/.buildozer/android/platform/android-sdk
        key: android-sdk-${{ runner.os }}
        restore-keys: |
          android-sdk-
    
    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: ~/.buildozer/android/platform/android-ndk
        key: android-ndk-${{ runner.os }}
        restore-keys: |
          android-ndk-
    
    - name: Build APK (Debug)
      run: |
        buildozer android debug || true
        # Retry if first attempt fails (common with buildozer)
        buildozer android debug
    
    - name: Find APK
      run: |
        ls -la bin/
        APK_FILE=$(find bin -name "*.apk" -type f | head -1)
        echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
        echo "Found APK: $APK_FILE"
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: musicdl-apk
        path: bin/*.apk
        retention-days: 7
    
    - name: Send email with APK
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL APK 编译成功
        body: |
          您好！
          
          MusicDL Android APK 已编译成功。
          
          文件信息：
          - APK文件已上传到GitHub Actions Artifacts
          - 可在GitHub仓库的Actions页面下载
          
          如果您无法下载Artifacts，请手动访问：
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          祝您使用愉快！
        to: 13383817575@163.com
        from: MusicDL Builder
        attachments: bin/*.apk
    
    - name: Report failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: 13383817575@163.com
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: MusicDL APK 编译失败
        body: |
          您好！
          
          MusicDL Android APK 编译失败。
          
          请查看日志：
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          可能的原因：
          1. buildozer配置问题
          2. Android SDK/NDK下载失败
          3. Python依赖编译失败
        to: 13383817575@163.com
        from: MusicDL Builder